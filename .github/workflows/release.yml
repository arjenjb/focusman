name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SIGN_IDENTITY: 'Developer ID Application: CosmoCows B.V. (68RP9D4Z9J)'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Import signing and notarization credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CERTIFICATE_BASE64:?Missing APPLE_CERTIFICATE_P12_BASE64}"
          : "${CERTIFICATE_PASSWORD:?Missing APPLE_CERTIFICATE_PASSWORD}"
          : "${NOTARY_KEY_P8:?Missing APPLE_NOTARY_KEY_P8}"
          : "${NOTARY_KEY_ID:?Missing APPLE_NOTARY_KEY_ID}"
          : "${NOTARY_ISSUER_ID:?Missing APPLE_NOTARY_ISSUER_ID}"
          umask 077
          certificate="$RUNNER_TEMP/focusman-signing.p12"
          keychain="$RUNNER_TEMP/focusman-signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/focusman-notary.p8"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db

      - name: Build, sign, notarize and publish
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --clean --timeout 45m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/focusman-notary.p8
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

      - name: Remove signing credentials
        if: always()
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/focusman-signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
          rm -f "$RUNNER_TEMP/focusman-signing.p12" "$RUNNER_TEMP/focusman-notary.p8"
